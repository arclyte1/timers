<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:560px;padding-top:42px}.profile-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}.profile-login{font-size:22px;font-weight:800;margin:0 0 24px}.palette{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}.swatch{appearance:none;width:34px;height:34px;border-radius:50%;background:var(--color);border:3px solid transparent;cursor:pointer}.swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}.profile-actions{display:flex;justify-content:space-between;gap:12px}.logout{background:transparent;color:#ff8790;border:1px solid #633035;border-radius:7px;padding:9px 13px;cursor:pointer}</style><main><p><a class="ghost-button" href="/">← К таймерам</a></p><section class="profile-card"><h1>Профиль</h1><p id="profileLogin" class="profile-login"></p><label>Цвет ника</label><div id="palette" class="palette" aria-label="Палитра цветов ника"></div><div class="profile-actions"><button id="logout" class="logout">Выйти</button><button id="save" class="primary-button">Сохранить</button></div><p id="message" class="field-hint"></p></section></main><script src="/profile.js"></script></html>
