<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:560px;padding-top:42px}.profile-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}.profile-login{font-size:22px;font-weight:800;margin:0 0 24px}.color-field{display:flex;align-items:center;gap:10px}.color-preview{width:38px;height:38px;border-radius:8px;background:var(--nick-color);border:1px solid var(--line);flex:0 0 auto}.profile-actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.logout{background:transparent;color:#ff8790;border:1px solid #633035;border-radius:7px;padding:9px 13px;cursor:pointer}</style><main><p><a class="ghost-button" href="/">← К таймерам</a></p><section class="profile-card"><h1>Профиль</h1><p id="profileLogin" class="profile-login"></p><label for="nickColor">Цвет ника (HEX)</label><div class="color-field"><span id="colorPreview" class="color-preview"></span><input id="nickColor" maxlength="7" pattern="#[0-9A-Fa-f]{6}" placeholder="#91a6ff" autocomplete="off" spellcheck="false"></div><p class="field-hint">Введите код в формате #RRGGBB, например #45c992.</p><div class="profile-actions"><button id="logout" class="logout">Выйти</button><button id="save" class="primary-button">Сохранить</button></div><p id="message" class="field-hint"></p></section></main><script src="/profile.js"></script></html>
