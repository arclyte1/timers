<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель</title><link rel="stylesheet" href="/styles.css"><style>main{padding-top:32px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.card{background:#121315;margin-bottom:10px}.row{display:flex;gap:8px}.row input{min-width:0}.role{color:var(--muted);font-size:12px}.danger{color:#ff8790;background:transparent;border:1px solid #633035;border-radius:6px;padding:8px;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><p><a class="ghost-button" href="/">← К таймерам</a></p><h1>Админ-панель</h1><div class="grid"><section class="panel"><h2>Новая ссылка</h2><form id="f"><label>Логин<input id="login" required pattern="[A-Za-z0-9._-]{3,64}"></label><label>Роль<select id="role"><option value="user">Обычный аккаунт</option><option value="admin">Администратор</option></select></label><button class="primary-button">Создать ссылку</button></form><p id="msg"></p></section><section class="panel"><div class="row"><button class="ghost-button" id="links">Активные ссылки</button><button class="ghost-button" id="users">Аккаунты</button></div><div id="list"></div></section></div></main><script src="/admin-panel.js"></script>
