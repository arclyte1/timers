<!doctype html><meta charset="utf-8"><title>Вход</title><style>body{background:#111;color:#eee;font:16px system-ui;display:grid;place-items:center;height:100vh;margin:0}form{width:300px;padding:24px;background:#191a1d;border-radius:10px}input,button{box-sizing:border-box;width:100%;margin:8px 0;padding:11px}button{background:#6d8cff;color:white;border:0;border-radius:6px}</style><form id=f><h2>Вход</h2><input id=l placeholder="Логин" required><input id=p type=password placeholder="Пароль" required><button>Войти</button><p id=e></p></form><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l.value,password:p.value})});if(r.ok)location='/';else e.target.querySelector('#e').textContent=(await r.json()).error}</script>
