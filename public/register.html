<!doctype html><meta charset="utf-8"><title>Регистрация</title><style>body{background:#111;color:#eee;font:16px system-ui;display:grid;place-items:center;height:100vh;margin:0}form{width:300px;padding:24px;background:#191a1d;border-radius:10px}input,button{box-sizing:border-box;width:100%;margin:8px 0;padding:11px}button{background:#6d8cff;color:white;border:0;border-radius:6px}</style><form id=f><h2>Создать пароль</h2><input id=p type=password minlength=10 placeholder="Пароль (не менее 10 символов)" required><input id=q type=password placeholder="Повторите пароль" required><button>Зарегистрироваться</button><p id=e></p></form><script>f.onsubmit=async e=>{e.preventDefault();if(p.value!==q.value)return e.target.querySelector('#e').textContent='Пароли не совпадают';let r=await fetch('/api/auth/register/'+location.pathname.split('/').pop(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location='/';else e.target.querySelector('#e').textContent=(await r.json()).error}</script>
